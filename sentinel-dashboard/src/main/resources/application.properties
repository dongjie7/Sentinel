server.port=9000
#spring settings
server.servlet.encoding.force=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true

#cookie name setting
server.servlet.session.cookie.name=sentinel_dashboard_cookie

#logging settings
logging.level.org.springframework.web=INFO
logging.level.com.alibaba.csp.sentinel.slots.system: DEBUG
logging.file.name=${user.home}/logs/csp/sentinel-dashboard.log
logging.pattern.file= %d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
#logging.pattern.console= %d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

#auth settings
auth.filter.exclude-urls=/,/auth/login,/auth/logout,/registry/machine,/version
auth.filter.exclude-url-suffixes=htm,html,js,css,map,ico,ttf,woff,png
# If auth.enabled=false, Sentinel console disable login
auth.username=admin
auth.password=123456

# Inject the dashboard version. It's required to enable
# filtering in pom.xml for this resource file.
sentinel.dashboard.version=@project.version@

# nacos config
nacos.server.ip=nacos-registry:8848
# nacos.server.namespace=springboot3
nacos.server.username=nacos
nacos.server.password=nacos

# \u6570\u636E\u5E93\u8FDE\u63A5\u4FE1\u606F\uFF08\u4EE5MySQL\u4E3A\u4F8B\uFF09
spring.datasource.url=jdbc:mysql://192.168.117.132:3306/sentinel?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP\u8FDE\u63A5\u6C60\u914D\u7F6E
# \u6700\u5927\u8FDE\u63A5\u6570
spring.datasource.hikari.maximum-pool-size=10
# \u6700\u5C0F\u7A7A\u95F2\u8FDE\u63A5\u6570
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
# \u8FDE\u63A5\u6700\u5927\u751F\u547D\u5468\u671F\uFF08\u6BEB\u79D2\uFF09
spring.datasource.hikari.max-lifetime=300000
# \u83B7\u53D6\u8FDE\u63A5\u7684\u8D85\u65F6\u65F6\u95F4\uFF08\u6BEB\u79D2\uFF09
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.connection-test-query=SELECT 1 # \u9A8C\u8BC1\u8FDE\u63A5\u7684SQL